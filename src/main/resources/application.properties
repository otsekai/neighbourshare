spring.application.name=SpringProject

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spring_project}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:otsekai}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

jwt.secret=${JWT_SECRET:dev-secret-change-me}
jwt.lifetime=86400000

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ????? ??????
spring.web.resources.static-locations=file:/app/static/,classpath:/static/