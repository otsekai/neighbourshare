<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — NeighbourShare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="auth-shell">
    <div class="theme-switcher auth-theme-switcher">
        <button class="theme-btn active" data-theme="light" title="Светлая тема"><i class="bi bi-brightness-high"></i></button>
        <button class="theme-btn" data-theme="dark" title="Тёмная тема"><i class="bi bi-moon"></i></button>
    </div>
    <section class="auth-card"><a class="auth-brand" href="/"><span class="brand-mark"><i
            class="bi bi-share brand-icon"></i></span>Neighbour<span style="color:var(--primary)">Share</span></a>
        <div class="eyebrow">С возвращением</div>
        <h1>Войдите в свой аккаунт</h1>
        <p class="lead">Продолжите делиться полезными вещами с соседями.</p>
        <div id="error" class="alert alert-danger d-none"></div>
        <form id="loginForm">
            <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email"
                                                                                        class="form-control" id="email"
                                                                                        placeholder="you@example.com"
                                                                                        autocomplete="email" required>
            </div>
            <div class="mb-4"><label for="password" class="form-label">Пароль</label><input type="password"
                                                                                            class="form-control"
                                                                                            id="password"
                                                                                            placeholder="Введите пароль"
                                                                                            autocomplete="current-password"
                                                                                            required></div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Войти
            </button>
        </form>
        <p class="mt-4 mb-0 text-center text-muted">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
    </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
