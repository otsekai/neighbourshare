<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои вещи — NeighbourShare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container"><a class="navbar-brand" href="/"><span class="brand-mark d-inline-grid me-2"><i
            class="bi bi-share brand-icon"></i></span>Neighbour<span>Share</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation"><i
                class="bi bi-list"></i></button>
        <div class="collapse navbar-collapse" id="navigation">
            <div class="navbar-nav ms-auto"><a class="nav-link" href="/"><i class="bi bi-grid me-1"></i>Каталог</a><a
                    class="nav-link active" href="/my-items.html"><i class="bi bi-box-seam me-1"></i>Мои вещи</a><a
                    class="nav-link" href="/bookings.html"><i class="bi bi-calendar3 me-1"></i>Брони</a><a
                    class="nav-link d-none" href="/admin.html" id="adminNavLink"><i class="bi bi-shield-check me-1"></i>Админ</a>
                <div class="theme-switcher">
                    <button class="theme-btn active" data-theme="light" title="Светлая тема"><i class="bi bi-brightness-high"></i></button>
                    <button class="theme-btn" data-theme="dark" title="Тёмная тема"><i class="bi bi-moon"></i></button>
                </div>
                <button class="btn btn-outline-light ms-lg-2" id="logoutBtn"><i class="bi bi-box-arrow-right"></i></button>

            </div>
        </div>
    </div>
</nav>
<main class="container">
    <div class="page-heading">
        <div>
            <div class="eyebrow">Ваш вклад в сообщество</div>
            <h1>Мои вещи</h1>
            <p class="text-muted mb-0">Управляйте вещами, которыми готовы поделиться с соседями.</p></div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addItemModal"><i
                class="bi bi-plus-lg me-2"></i>Добавить вещь
        </button>
    </div>
    <div id="myItemsList" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>
</main>
<div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="eyebrow mb-1">Новая публикация</div>
                    <h5 class="modal-title">Добавить вещь</h5></div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form id="addItemForm">
                    <div class="mb-3"><label for="itemTitle" class="form-label">Название</label><input type="text"
                                                                                                       class="form-control"
                                                                                                       id="itemTitle"
                                                                                                       placeholder="Например, перфоратор"
                                                                                                       required
                                                                                                       maxlength="120">
                    </div>
                    <div class="mb-4"><label for="itemCategory" class="form-label">Категория</label><select
                            class="form-select" id="itemCategory">
                        <option value="Toys">Игрушки</option>
                        <option value="Instruments">Инструменты</option>
                        <option value="Kitchen">Кухня</option>
                        <option value="Tourism">Туризм</option>
                        <option value="Devices">Устройства</option>
                        <option value="Renovation">Ремонт</option>
                    </select></div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-circle me-2"></i>Добавить в
                        каталог
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/items.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
